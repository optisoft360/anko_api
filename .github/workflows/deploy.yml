name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-migration-merge:
    runs-on: ubuntu-latest
    outputs:
      merge_created: ${{ steps.detect.outputs.merge_created }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate merge migration if needed
        run: |
          python manage.py makemigrations --merge --noinput

      - name: Detect generated merge migration
        id: detect
        shell: bash
        run: |
          if git diff --quiet -- api/migrations; then
            echo "merge_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merge_created=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push generated merge migration
        if: steps.detect.outputs.merge_created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/migrations
          git commit -m "chore: add merge migration [skip deploy]"
          git push

      - name: Confirm merge migration push
        if: steps.detect.outputs.merge_created == 'true'
        run: |
          echo "A merge migration was generated and pushed. Deploy will continue in this same workflow using the freshly pushed main branch."

  deploy:
    runs-on: ubuntu-latest
    needs: prepare-migration-merge

    steps:
      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            chmod +x ./deploy.sh
            export APP_DIR="${{ secrets.DEPLOY_PATH }}"
            export BRANCH="main"
            export COMPOSE_FILE="docker-compose.yml"
            export PORTS_TO_FREE="${{ secrets.PORTS_TO_FREE }}"
            export LOG_TAIL_LINES="${{ secrets.LOG_TAIL_LINES }}"
            ./deploy.sh
